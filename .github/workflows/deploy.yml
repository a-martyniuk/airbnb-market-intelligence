name: Deploy AirMarket AI
# Frontend is deployed automatically by Vercel's native GitHub integration.
# This workflow only validates the build and deploys the backend to Render.
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend (Validation Check)
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://dummy-backend.onrender.com

  deploy-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render deployment..."
          curl -f "$RENDER_DEPLOY_HOOK"
