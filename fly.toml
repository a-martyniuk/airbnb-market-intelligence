# fly.toml file for deploying the FastAPI backend to Fly.io
app = "airmarket-backend"
primary_region = "eze"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/app/data/airbnb_intelligence.db"

[[mounts]]
  source = "airmarket_data"
  destination = "/app/data"
  initial_size = "1GB"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false

[[vm]]
  size = "shared-cpu-1x"
  memory = "256MB"
  cpus = 1
